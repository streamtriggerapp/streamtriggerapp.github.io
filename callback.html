<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="favicon.png" />
  <meta charset="UTF-8" />
  <title>TikTok Connected | StreamTrigger</title>

  <script>
  const params = window.location.search;

  if (params.includes("code=")) {
    window.location.href = "http://127.0.0.1:8765/callback" + params;
  }
</script>

  <style>
    
    .website-brand {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 30px;
}

.website-logo {
  width: 72px;
  height: 72px;
  border-radius: 18px;
}
    body{
      font-family:Arial;
      background:#070b1f;
      color:white;
      padding:40px;
      text-align:center;
    }

    .box{
      max-width:700px;
      margin:auto;
      background:rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.1);
      border-radius:20px;
      padding:40px;
    }

    h1{
      color:#ff2f7d;
    }

    p{
      color:#cbd5e1;
    }
  </style>
</head>

<body>
  <div class="website-brand">
  <img src="favicon.png" class="website-logo" />

  <div>
    <h1>StreamTrigger</h1>
    <p>TikTok Authorization</p>
  </div>
</div>

<div class="box">

  <h1>TikTok Authorization Completed</h1>

  <p>
    Your TikTok account was connected successfully.
  </p>

  <p>
    You can now return to StreamTrigger.
  </p>

  <div id="status"></div>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const code = params.get("code");
const error = params.get("error");

const status = document.getElementById("status");

if(error){
  status.innerHTML =
    `<p style="color:#ff6b6b;">Error: ${error}</p>`;
}

if(code){

  status.innerHTML =
    `<p style="color:#4ade80;">
      Authorization code received successfully.
    </p>`;

  console.log("TikTok code:", code);
}

</script>

</body>
</html>
