<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TikTok Connected | StreamTrigger</title>
</head>
<body style="font-family: Arial; background:#0b1028; color:white; padding:40px; text-align:center;">
  <h1>TikTok Authorization Completed</h1>
  <p>Returning to StreamTrigger desktop app...</p>
  <p id="status">Please wait...</p>

  <script>
    const params = new URLSearchParams(window.location.search);

    const code = params.get("code");
    const state = params.get("state");
    const error = params.get("error");
    const errorDescription = params.get("error_description");

    const status = document.getElementById("status");

    if (error) {
      status.textContent = "Authorization failed. Return to StreamTrigger.";
    } else if (code) {
      const localCallback =
        "http://127.0.0.1:8765/callback?code=" +
        encodeURIComponent(code) +
        "&state=" +
        encodeURIComponent(state || "");

      window.location.href = localCallback;

      setTimeout(() => {
        status.textContent = "If nothing happens, return to StreamTrigger and try again.";
      }, 3000);
    } else {
      status.textContent = "No authorization code received.";
    }
  </script>
</body>
</html>
