<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TikTok Connected | StreamTrigger</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f1020, #1d1145, #3c1361);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 24px;
      padding: 40px;
      max-width: 720px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }

    .logo {
      width: 100px;
      height: 100px;
      border-radius: 24px;
      margin-bottom: 20px;
    }

    h1 {
      color: #ff4fc3;
      margin-bottom: 20px;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
    }

    .success {
      color: #4dff88;
      font-weight: bold;
      margin-top: 20px;
    }

    .error {
      color: #ff5a5a;
      font-weight: bold;
    }

    .btn {
      margin-top: 30px;
      display: inline-block;
      padding: 14px 28px;
      border-radius: 999px;
      background: linear-gradient(90deg, #ff3ca6, #ff6bd5);
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="logo.png" class="logo" alt="StreamTrigger Logo" />

    <h1>TikTok Authorization Completed</h1>

    <p>Your TikTok authorization was completed successfully.</p>

    <p id="status">Returning to StreamTrigger desktop app...</p>

    <p class="success" id="successText"></p>
    <p class="error" id="errorText"></p>

    <a class="btn" href="https://streamtriggerapp.github.io">
      Back to StreamTrigger Website
    </a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);

    const code = params.get("code");
    const state = params.get("state");
    const error = params.get("error");

    const status = document.getElementById("status");
    const successText = document.getElementById("successText");
    const errorText = document.getElementById("errorText");

    if (error) {
      errorText.textContent = "TikTok authorization failed.";
      status.textContent = "Please return to StreamTrigger and try again.";
    } else if (code) {
      successText.textContent = "Authorization code received successfully.";

      const deepLink =
        "streamtrigger://auth/callback?code=" +
        encodeURIComponent(code) +
        "&state=" +
        encodeURIComponent(state || "");

      window.location.href = deepLink;

      setTimeout(() => {
        status.textContent =
          "If StreamTrigger did not open automatically, return to the desktop app and click Connect again.";
      }, 3000);
    } else {
      errorText.textContent = "No authorization code received.";
      status.textContent = "Authorization could not be completed.";
    }
  </script>
</body>
</html>
